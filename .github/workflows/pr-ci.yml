# .github/workflows/pr-ci.yml
# PREIshare PR CI (Sprint 6). Runs on every pull request to main.
# Contract: docs/ci/pipeline-design.md + docs/ci/project-ci-inventory.md
# Stages (docs/ci/pipeline-design.md order): checkout -> Node 22 -> npm ci -> lint -> typecheck -> test -> build.
# Every command below is an exact package.json script (see docs/ci/ci-scripts-notes.md). No continue-on-error anywhere.
# No secrets, no deploy, no Supabase.

name: PR CI

# Every pull request into main (docs/ci/pipeline-design.md: main is the only merge target).
# opened = new PR, synchronize = new commits pushed to it, reopened = closed PR reopened.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Read-only: CI only needs to read the code.
permissions:
  contents: read

# One run per PR: a new push cancels the older, now-outdated run for the SAME PR only.
# Group = this workflow's name + PR number (falls back to the ref if there's no PR number),
# so different PRs and other workflows never cancel each other.
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          # README says "Node.js 20 or newer"; 22 is required by `npm run test`
          # (Node's built-in test runner with --experimental-strip-types needs Node >= 22.6).
          node-version: "22"
          # npm + package-lock.json (inventory), so cache npm downloads keyed on the lockfile.
          cache: npm

      - name: Install dependencies (clean, from package-lock.json)
        run: npm ci

      # Exact script from package.json: "lint": "node scripts/lint.mjs"
      # Zero-dependency repo lint: no secrets, no VITE_ server keys, no debugger/.only, no hidden CI failures.
      - name: Lint
        run: npm run lint

      # Exact script from package.json: "typecheck": "tsc --noEmit --project tsconfig.typecheck.json"
      # (NOT typecheck:errors, which includes intentional-error fixtures and always fails.)
      # No continue-on-error: a type error must turn the PR check red.
      - name: Typecheck
        run: npm run typecheck

      # Exact script from package.json: "test": "node --test --experimental-strip-types \"src/**/*.test.ts\""
      # Non-watch: runs once and exits (non-zero on any failing test). Offline: provider is mocked.
      - name: Test
        run: npm run test

      # Exact script from package.json: "build": "vite build" (same build Vercel runs).
      # Runs after typecheck so type errors fail faster. No continue-on-error.
      - name: Build
        run: npm run build
