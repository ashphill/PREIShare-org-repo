# .github/workflows/pr-ci.yml
# PREIshare PR CI — scaffold only (Sprint 6, Step 6).
# Contract: docs/ci/pipeline-design.md + docs/ci/project-ci-inventory.md
# This pass: checkout -> Node 20 -> npm ci. Typecheck and build are added in the next step.
# No secrets, no deploy, no Supabase.

name: PR CI

on:
  pull_request:
    branches: [main]

# Read-only: CI only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-outdated run.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          # Inventory: no .nvmrc/engines; README says "Node.js 20 or newer".
          node-version: "20"
          # npm + package-lock.json (inventory), so cache npm downloads keyed on the lockfile.
          cache: npm

      - name: Install dependencies (clean, from package-lock.json)
        run: npm ci
